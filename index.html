["Willkommen","Mit dieser App berechnest du Mineralisierungs-Rezepte für Kaffeewasser mit den Tropfen-Konzentraten von Lotus Coffee Products.\nDie kurze Tour zeigt dir alle Funktionen. Du kannst sie jederzeit überspringen und im Menü neu starten."],
["Deine Rezepte","Jede Karte zeigt Name, Brühmethoden, Bewertung sowie Hardness (Gesamthärte) und Alkalinity (Karbonathärte) als Zielwert in ppm.\nAntippen öffnet das Rezept. Nach links wischen löscht es (mit Rückfrage), langes Halten und Ziehen ändert die Reihenfolge.\nEin kleines „+5“ neben einem Wert bedeutet: Dein Ausgangswasser erhöht diesen Wert um 5 ppm."],
["Liste oder Raster","Hier wechselst du zwischen der Listenansicht und der kompakten Rasteransicht."],
["Filtern und sortieren","Filtere nach Brühmethode, Mindestbewertung, Hardness und Alkalinity oder sortiere nach Alkalinität, Hardness und Bewertung. Deine eigene Reihenfolge bleibt erhalten, „Zurücksetzen“ stellt sie wieder her."],
["Rezepte vergleichen","Tippe auf das Symbol und wähle zwei Rezepte aus. Unten erscheint der Vergleich mit Hardness, Alkalinity, TDS und den Ionen. Nicht gewählte Rezepte werden grau."],
["Neues Rezept","Das Plus öffnet die Vorlagen: ein leeres Rezept, die Lotus-Vorlagen Bright and Juicy, Rao's Recipe und Ultra Light oder eine Kopie eines eigenen Rezepts. Wie alle Fenster schließt du es mit dem Balken oben."],
["Menü","Hier verwaltest du Brühmethoden (eigene lassen sich anlegen und löschen) und Ausgangswasser (eigene Wasser mit Werten in mg pro Liter hinzufügen). Außerdem wechselst du Sprache und Darstellung (Hell, Dunkel, Geräteeinstellung), schaltest die Liquid-Animation der Verläufe an oder aus und startest dieses Tutorial neu."],
["Das Rezept","Oben stehen Name und Zielwerte. Hardness und Alkalinity ändern sich live mit deinen Eingaben. Tippe auf den Namen, um ihn zu ändern."],
["Zielwerte","Lege fest, wie viel Magnesium und Calcium (zusammen die Hardness) sowie Natrium und Kalium (die Alkalinity) dein Wasser haben soll, in ppm als CaCO₃. Der Stift ganz unten sperrt die Zielwerte gegen versehentliches Ändern."],

en:[
["Welcome","This app calculates mineralisation recipes for coffee water using the drop concentrates from Lotus Coffee Products.\nThis short tour shows you every feature. You can skip it at any time and restart it from the menu."],
["Your recipes","Each card shows the name, brew methods, rating and the target Hardness and Alkalinity in ppm.\nTap to open a recipe. Swipe left to delete it (with confirmation), press and hold, then drag to change the order.\nA small “+5” next to a value means your source water raises that value by 5 ppm."],
["List or grid","Switch between the list view and the compact grid view here."],
["Filter and sort","Filter by brew method, minimum rating, Hardness and Alkalinity, or sort by Alkalinity, Hardness and rating. Your own order is kept; “Reset” brings it back."],
["Compare recipes","Tap the icon and pick two recipes. The comparison with Hardness, Alkalinity, TDS and the ions appears at the bottom. Recipes you did not pick turn grey."],

["The recipe","Name and target values are at the top. Hardness and Alkalinity update live as you type. Tap the name to change it."],

["Drops","This is how many drops of each concentrate go into the water, as a whole number. The exact value is shown below."],
["Key figures","Hardness and Alkalinity in ppm and in degrees, plus total dissolved solids (TDS) and alkalinity in meq/L, each for your recipe including the source water."],

["Ions","The ion concentrations in mg per litre: magnesium, calcium, sodium, potassium, chloride and HCO₃."],
["Rating and notes","Give stars, pick one or more brew methods and note how the water tasted."],

["Done","That was the tour. You can restart it at any time from the menu under “Start tutorial”. Enjoy your recipes!"]]};

function tuShow(){const i=ACT[K],st=STEPS[i],x=TT[S.lang][i],last=K==ACT.length-1;
